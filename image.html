<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Individual Framed Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="gallery">
    <div class="image-box">
      <img src="download (1).jpeg" alt="Image 1" class="gallery-img">
    </div>
    <div class="image-box">
      <img src="download (2).jpeg" alt="Image 2" class="gallery-img">
    </div>
    <div class="image-box">
      <img src="download (3).jpeg" alt="Image 3" class="gallery-img">
    </div>
    <div class="image-box">
      <img src="download (4).jpeg" alt="Image 4" class="gallery-img">
    </div>
    <div class="image-box">
      <img src="download (5).jpeg" alt="Image 5" class="gallery-img">
    </div>
    <div class="image-box">
      <img src="download (6).jpeg" alt="Image 6" class="gallery-img">
    </div>
    <div class="image-box">
      <img src="download (7).jpeg" alt="Image 7" class="gallery-img">
    </div>
  </div>

  <div id="lightbox" class="lightbox">
    <span class="close" id="closeBtn">&times;</span>
    <img id="lightbox-img" src="" alt="Expanded View">
  </div>

  <script src="script.js"></script>
</body>
</html>
